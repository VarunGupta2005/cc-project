events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream api_cluster {
        # Round-robin load balancing across 3 stateless API replicas
        server rescuegrid_api_1:5000;
        server rescuegrid_api_2:5000;
        server rescuegrid_api_3:5000;
    }

    server {
        listen 80;

        # Serve Pre-compiled React 18 Client Application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Stateless REST API Load Balancing
        location /api/ {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Cluster Health check endpoint
        location /health {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
        }

        # Real-Time WebSocket Upgrade Proxying
        location /socket.io/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Load balancer static status
        location /lb-health {
            return 200 "RescueGrid Load Balancer OK\n";
            add_header Content-Type text/plain;
        }
    }
}
